version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, nuget]
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      grpc:
        patterns: ["Grpc.*", "Google.Protobuf"]
      analyzers:
        patterns: ["Microsoft.CodeAnalysis.*", "Roslynator.*"]
      test:
        patterns: ["NUnit*", "Microsoft.NET.Test.Sdk", "coverlet.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, github-actions]
